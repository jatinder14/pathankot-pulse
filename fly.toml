# fly.io — optional public host
#   fly launch --no-deploy
#   fly volumes create pulse_data --size 1
#   fly deploy

app = "pathankot-pulse"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
