# Default region for Pathankot Pulse (personal / private mode)
region:
  id: pathankot
  label: Pathankot, Punjab
  pincode: "145023"
  state: Punjab
  city: Pathankot
  nearby:
    - Sujanpur
    - Gurdaspur
    - Kangra
    - Nurpur
    - Jammu
    - Kathua
  radius_km: 80
  # When publishing worldwide, set region_mode: user_select
  region_mode: fixed_default

owner:
  mode: private  # private | public
  brand: Pathankot Pulse
  tagline: Tenders · private jobs · bank auctions — Pathankot / Kathua / Jammu

# Private-sector jobs — Pathankot-first · active · ad-hoc side income
private_jobs:
  enabled: true
  alert_on_usable: true
  max_age_days: 45
  home_city: Pathankot
  # Stack income: ad-hoc specialist / store-launch / freelance alongside GeM
  side_hustle:
    enabled: true
    prefer_adhoc: true
  local_employers:
    - name: Varun Beverages (PepsiCo franchise)
      location: Pathankot, Punjab
      search:
        - Varun Beverages Pathankot
        - Varun Beverages Ltd Pathankot plant
    - name: Pioneer Industries
      location: Pathankot, Punjab · distillery / starch
      search:
        - Pioneer Industries Pathankot
        - Pioneer Pathankot hiring
    - name: Kandhari Beverages (Coca-Cola FBO)
      location: Kathua · near Pathankot
      search:
        - Kandhari Kathua Pathankot
        - Kandhari Beverages Coca Cola
    - name: PDIL (Projects & Development India Ltd)
      location: PSU · prefer Pathankot / Punjab posting
      search:
        - PDIL hiring Pathankot
        - PDIL contract Punjab
  retail_brands:
    - Reliance Smart
    - Vishal Mega Mart
    - More Retail
    - Trends
    - Croma
    - Vijay Sales
    - Decathlon
    - Pantaloons
    - Domino's
    - McDonald's
    - Burger King
    - Cafe Coffee Day
    - Starbucks
    - Max Fashion
    - Bata
    - Lenskart
    - Jockey
  apna_cities:
    - pathankot
    - kathua
    - jammu
  locations:
    - Pathankot, Punjab
    - Sujanpur, Pathankot
    - Gurdaspur, Punjab
    - Kathua, Jammu and Kashmir
    - Jammu, Jammu and Kashmir
  queries:
    - adhoc specialist Pathankot
    - freelance consultant Pathankot
    - visiting faculty Pathankot
    - part time IT Pathankot
    - contract basis computer Pathankot
    - store IT setup Pathankot
    - POS training Pathankot
    - digital literacy trainer Pathankot
    - AI trainer Pathankot
    - CCTV installation Pathankot
    - networking specialist Pathankot
    - new store opening Pathankot hiring
    - store manager Pathankot
    - showroom opening Pathankot
    - franchise Pathankot Punjab
    - retail store Pathankot
    - Reliance Smart Pathankot jobs
    - Vishal Mega Mart Pathankot
    - Domino's Pathankot hiring
    - Croma Pathankot jobs
    - jobs in Pathankot
    - IT support Pathankot
    - area manager Pathankot
    - Varun Beverages Pathankot
